services:
  - type: web
    name: skillsforge
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run db:generate --workspace=skillsforge && npx prisma migrate deploy --schema apps/skillsforge/prisma/schema.prisma && npm run build --workspace=skillsforge
    startCommand: npm run start --workspace=skillsforge
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: skillsforge-db
          property: connectionString
      - key: DATABASE_URL_DIRECT
        fromDatabase:
          name: skillsforge-db
          property: connectionString
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: NEXTAUTH_URL
        sync: false
      - key: APP_URL
        sync: false
      - key: INTERNAL_SECRET
        generateValue: true
      - key: APP_TIMEZONE
        value: Asia/Kolkata
      - key: SKILLSFORGE_DEV_AUTH
        value: "false"
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: AUTHORIZED_EMAILS
        sync: false
      - key: NEXT_PUBLIC_GOOGLE_AUTH_ENABLED
        value: "true"

databases:
  - name: skillsforge-db
    plan: free
    databaseName: skillsforge
    user: skillsforge
